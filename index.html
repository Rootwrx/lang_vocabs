<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Lists</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1f2937;--mut:#6b7280;--ac:#4f46e5;--ok:#16a34a;--no:#dc2626;--soft:#eef2ff;--ar:#065f46;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#e5e7eb;--mut:#9ca3af;--ac:#a5b4fc;--soft:#1e293b;--ar:#a7f3d0;--bd:#374151}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#e5e7eb;--mut:#9ca3af;--ac:#a5b4fc;--soft:#1e293b;--ar:#a7f3d0;--bd:#374151}
.hide-ar .ar,.hide-ar .arbtn{display:none!important}
.no-yg .ygbtn,.no-yg .yg,.no-yg .famyg,.no-yg .ygi{display:none!important}.no-yg .fam{pointer-events:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 'Segoe UI',Helvetica,Arial,sans-serif}
a{color:var(--ac)}
header{position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 1px 0 var(--bd)}
.hin{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center}
.hin>a{color:var(--ac);text-decoration:none;font-weight:700}.grow{flex:1}
.hb{background:var(--soft);color:var(--ac);border:0;border-radius:10px;padding:3px 9px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}.hb.off{opacity:.4;text-decoration:line-through}
/* segmented control: language switch + filters */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ac);font:inherit;font-size:15px;font-weight:700;padding:3px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ac);color:var(--bg)}.seg.lg{margin:4px 0 10px}.seg.lg button{font-size:16px;padding:6px 14px}
.crumbs{max-width:720px;margin:0 auto;padding:0 16px 8px;font-size:15px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.crumbs:empty{display:none}.crumbs a{color:var(--ac);text-decoration:none}.crumbs i{font-style:normal;opacity:.5}.crumbs span{color:var(--tx);font-weight:600}
main{max-width:720px;margin:0 auto;padding:4px 16px 60px}
.card{background:var(--card);border-radius:18px;padding:22px 20px;margin:12px 0;box-shadow:0 6px 22px rgba(0,0,0,.08)}
.card.slim{padding:14px 18px}.card.empty{opacity:.75;box-shadow:none;border:1px dashed var(--bd)}
.blk{display:block;color:inherit;text-decoration:none}.center{text-align:center}.row{margin-top:14px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:0 0 6px}.card.slim h2{margin:0}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;margin:4px 4px 4px 0;font:inherit;font-weight:700;background:var(--ac);color:var(--bg);cursor:pointer;text-decoration:none}
.btn.alt{background:var(--soft);color:var(--ac)}.btn[disabled]{opacity:.4}
.mut{color:var(--mut);font-size:15px}.ar{direction:rtl;text-align:right;font-size:21px;color:var(--ar);line-height:1.7}
.big{font-size:42px;font-weight:800;color:var(--ac);overflow-wrap:anywhere}.emo{font-size:54px}
.pos{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;background:var(--ac);color:var(--bg);border-radius:20px;padding:1px 10px}
.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.box{padding:14px 18px;margin:14px 0;border-left:5px solid var(--ac);background:var(--soft);border-radius:10px}
.box b{color:var(--ac)}.box>div+div{margin-top:6px}.note{border-color:#3b82f6}
.chip{display:inline-block;margin:3px;padding:3px 12px;border-radius:14px;background:var(--soft);color:var(--ac);text-decoration:none;font-size:16px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--bg)}.chip.faint{opacity:.55}
button.chip{border:0;font:inherit;font-size:16px;cursor:pointer;white-space:normal}
.strip{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;margin:0 -4px;-webkit-overflow-scrolling:touch}.strip .chip{flex:none}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.jump{flex:1;min-width:0;max-width:200px;font:inherit;font-size:15px;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
.text p{margin:0 0 14px;line-height:1.8}.tw{border-bottom:2px solid var(--ac);color:var(--ac);font-weight:700;cursor:pointer}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ac)}
input.ans,select.ans{width:100%;font:inherit;font-size:22px;padding:8px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center;margin:10px 0}
select.ans{font-size:18px;text-align:left}input.ans[type=search]{font-size:18px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.rate .btn{margin:0;padding:10px 4px}
.good{color:var(--ok);font-weight:700}.bad{color:var(--no);font-weight:700}
.spk{cursor:pointer}
.tagc{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);border:1px solid var(--bd);border-radius:10px;padding:0 7px;vertical-align:middle}
.gram{font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:720px;width:100%;max-height:92vh;overflow:auto}
.tools{margin-top:8px}.sm{font-size:14px;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:90%}
.ygbtn{font-size:14px;padding:3px 10px;margin:4px 0 0}.yg{margin:8px 0}.yg .nav{margin-top:4px}.yg a{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.grid .card{margin:0}
.gc{display:block;color:inherit;text-decoration:none}.gi{font-size:30px;line-height:1}
.cont{display:block;color:inherit;text-decoration:none;border-left:6px solid var(--ac)}.cont h2{margin:2px 0}
.step{display:flex;gap:14px;align-items:flex-start}.step .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--bg);font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}.step p{margin:0 0 6px}
.src{display:inline-block;margin-left:8px;padding:1px 9px;border:1px solid var(--bd);border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);vertical-align:middle}
@media(max-width:420px){.hin{gap:6px;padding:8px 12px}#brand-t{display:none}.seg button{padding:3px 8px}}
</style></head><body>
<header><div class="hin"><a href="#/" id="brand">📚 <span id="brand-t">Word Lists</span></a><span class="grow"></span>
<div class="seg" id="langsw"></div>
<button class="hb" id="b-ar" title="العربية">ع</button><button class="hb" id="b-yg" title="YouGlish">🎬</button><a class="hb" href="#/settings" id="b-set">⚙️</a></div>
<nav class="crumbs" id="crumbs"></nav></header>
<main id="app">Loading…</main>
<script src="js/github.js"></script>
<script src="js/i18n.js"></script>
<script src="js/manage.js"></script>
<script src="js/practice.js"></script>
<script src="js/app.js"></script>
</body></html>
